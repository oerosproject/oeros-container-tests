# PS-012 recorded contract for the oeros candidate images.
# Re-recorded 2026-10-01 from oeros-container-ros-core and oeros-container-ros-base, built from
# meta-oeros after OCI_IMAGE_* settings in oeros-container-image.inc started taking effect.
# The 2026-09-27 recording had no entrypoint, cmd /bin/sh and no baked-in ROS_DISTRO, because
# those settings were silently ignored; the images now match OSRF's entrypoint and ROS_DISTRO.
# This is a regression baseline, not a target. When meta-oeros changes one of these values on
# purpose, update this file in the same change.
config:
  entrypoint: [/ros_entrypoint.sh]
  cmd: [/bin/bash]
  user: ""
  workdir: ""
  env:
    ROS_DISTRO: lyrical
    ROS_VERSION: "2"
    LANG: C.UTF-8
files:
  - /ros_entrypoint.sh
  - /opt/ros/lyrical/setup.bash
  - /opt/ros/lyrical/setup.sh
shell: bash.bash
# Per-tier overrides; `config` merges key by key.
tiers:
  desktop-full:
    config:
      workdir: /root
      env:
        QT_X11_NO_MITSHM: "1"
