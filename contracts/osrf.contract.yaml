# PS-012 recorded contract for the OSRF reference images (ros:lyrical-*, osrf/ros:lyrical-*).
# Recorded 2026-09-27 from ros:lyrical-ros-core and ros:lyrical-ros-base. Applies to every
# tier unless a `tiers:` entry overrides a key.
#
# config:  image configuration (`inspect`), compared exactly for entrypoint, cmd, user and
#          workdir, and as a subset for env.
# files:   paths that must exist in the image.
# shell:   basename of `readlink -f /bin/sh` (the default shell).
config:
  entrypoint: [/ros_entrypoint.sh]
  cmd: [bash]
  user: ""
  workdir: ""
  env:
    ROS_DISTRO: lyrical
    LANG: C.UTF-8
files:
  - /ros_entrypoint.sh
  - /opt/ros/lyrical/setup.bash
  - /opt/ros/lyrical/setup.sh
shell: dash
tiers: {}
