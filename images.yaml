# Image matrix: tier x family -> image reference. Tests never hard-code image names.
#
# osrf:  Docker Hub reference image. `digest` is the multi-arch index digest, so one value
#        covers x86-64 and arm64. Empty means "unpinned tag"; tools/refresh_digests.py fills it
#        and CI refuses unpinned images (REQUIRE_PINNED_DIGESTS=1).
# oeros: `image` is the oeros-container-<suffix> bitbake recipe name; it names the OCI layout in
#        the bitbake deploy directory (tools/load_oeros.py). `repository` is the registry
#        repository the image is published under, `namespace` (optional) a path in front of it:
#        the images built in the desktop multiconfigs (x11, commercially licensed components,
#        for development rather than deployment on a robot) live under `desktop/`. The
#        reference is `<namespace><repository>:<oeros_tag>-<arch>`, for example
#        oeros-ros-core:lyrical-amd64 or desktop/oeros-desktop:lyrical-arm64, with
#        `oeros_registry` in front for a registry pull and no prefix for OEROS_SOURCE=local.
#        `arches` (optional, default both) lists the architectures the image is published for;
#        the CI matrix skips the others.
#        The tests always use the arch-specific tag, never the multi-architecture `lyrical`
#        or `latest` index tags. The build records the same names next to each OCI layout in
#        <recipe>-oci.publish, and tools/load_oeros.py checks them against this file.
#        Registry and tag come from `defaults` and can be overridden with OEROS_REGISTRY and
#        OEROS_TAG.
#
# sloretz: the ros_oci_images publisher (github.com/sloretz/ros_oci_images), pulled from
#          ghcr.io and pinned by digest like osrf. Its tags are multi-arch, so the digest
#          covers both architectures and there is no arch-specific tag. Its failures are
#          differences, not run failures (matrix.REPORT_ONLY_FAMILIES). It has no dev image.
#
# Keep each osrf and sloretz entry on one line: tools/refresh_digests.py edits the `digest`
# field in place.

defaults:
  oeros_registry: ghcr.io/oerosproject
  # The ROS distribution part of the tag; the architecture is appended (lyrical-amd64).
  # Override with OEROS_TAG.
  oeros_tag: lyrical

# The six REP-2001 tiers. `tiers: [all]` in a spec's front matter means these.
tiers:
  ros-core:
    osrf:  {repo: docker.io/library/ros, tag: lyrical-ros-core, digest: "sha256:d586d46d155c860f435ff39cebdb5cc9d250ecbcc0ff9b46241f16a3d87ca010"}
    oeros: {image: oeros-container-ros-core, repository: oeros-ros-core}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-ros-core, digest: "sha256:8b16835500fccce046875977920cab8136d929f4a89d84e5c26ddd03bed5b970"}
  ros-base:
    osrf:  {repo: docker.io/library/ros, tag: lyrical-ros-base, digest: "sha256:d9078270abaeae65497036085f1654c75ec0a95e2aca5ecf7ddc0846a6cd69e1"}
    oeros: {image: oeros-container-ros-base, repository: oeros-ros-base}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-ros-base, digest: "sha256:05dd38947f16e70331d2039407751571d8ef9fdc2507922fcffec70be8857e1e"}
  perception:
    osrf:  {repo: docker.io/library/ros, tag: lyrical-perception, digest: "sha256:ac995394494cb52115f4af92797df22eee52f3beecb15e8da07a6ed20603c2bb"}
    oeros: {image: oeros-container-perception, repository: oeros-perception, namespace: desktop/}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-perception, digest: "sha256:7c29e6f0123f2adf30c44f06bc8c20e19369418ef27f373afd3ddd29faabda37"}
  simulation:
    osrf:  {repo: docker.io/osrf/ros, tag: lyrical-simulation, digest: "sha256:e4a9a9a8f14dc509563f8d0786452e2982ac70f4132e5432e5986e6005e1b8ba"}
    oeros: {image: oeros-container-simulation, repository: oeros-simulation, namespace: desktop/}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-simulation, digest: "sha256:6dc953f773eeb1040482d09c71a954e68b683b56a0cd114b9281a90c63135e59"}
  desktop:
    osrf:  {repo: docker.io/osrf/ros, tag: lyrical-desktop, digest: "sha256:cd0f24da968e3a7e8d0ef76b8d3684483235c86f5ab6a69ca2d4c9d7368a71f7"}
    oeros: {image: oeros-container-desktop, repository: oeros-desktop, namespace: desktop/}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-desktop, digest: "sha256:5d040b4f6dfb5317f588710e100941eae4fe00143f3b55d59764224586dbd342"}
  desktop-full:
    osrf:  {repo: docker.io/osrf/ros, tag: lyrical-desktop-full, digest: "sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba"}
    oeros: {image: oeros-container-desktop-full, repository: oeros-desktop-full, namespace: desktop/}
    sloretz: {repo: ghcr.io/sloretz/ros, tag: lyrical-desktop-full, digest: "sha256:549256612921d3e7f5e866e8219447110f25e02d4cc101e6a96be87f5a8eb1cf"}

# Build-tools pairing (PS-005, PS-006): OSRF ros-base ships colcon and rosdep, oeros keeps
# them in ros-dev. Accepted, intended difference. Used only by specs that list `dev` in their
# front matter tiers.
extra_tiers:
  dev:
    osrf:  {repo: docker.io/library/ros, tag: lyrical-ros-base, digest: "sha256:d9078270abaeae65497036085f1654c75ec0a95e2aca5ecf7ddc0846a6cd69e1"}
    oeros: {image: oeros-container-ros-dev, repository: oeros-ros-dev}
